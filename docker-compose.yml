services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: smartprep
      MYSQL_USER: smartprep
      MYSQL_PASSWORD: smartprep
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://smartprep:smartprep@db:3306/smartprep
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  dbdata:
